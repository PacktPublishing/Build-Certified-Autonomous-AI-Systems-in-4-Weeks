services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Deployable AI Agent API"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2:1b"
      REQUEST_TIMEOUT_SECONDS: "120"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
